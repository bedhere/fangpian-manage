# Independent cloud service. 示例品牌 SSO secrets in /opt/agimax/private/external-collab/connection.env.
services:
  api:
    environment:
      EXTERNAL_COLLAB_URL: http://external-collab:3003
      EXTERNAL_COLLAB_PROXY_SECRET: ${EXTERNAL_COLLAB_PROXY_SECRET}
  external-collab:
    image: agimax-external-collab:latest
    restart: unless-stopped
    env_file: /opt/agimax/private/external-collab/connection.env
    environment:
      DATABASE_URL: postgresql://external_collab:${EXTERNAL_COLLAB_POSTGRES_PASSWORD}@external-collab-postgres:5432/external_collab
    depends_on:
      external-collab-postgres: {condition: service_healthy}
    networks: [default]
    volumes:
      - /opt/agimax/private/wecom-20261028/bin/wecom-cli:/usr/local/bin/wecom-cli:ro
      - /opt/agimax/private/wecom-20261028/credentials:/home/node/.config/wecom-cli
  external-collab-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: external_collab
      POSTGRES_PASSWORD: ${EXTERNAL_COLLAB_POSTGRES_PASSWORD}
      POSTGRES_DB: external_collab
    command: [postgres, -c, max_connections=30, -c, shared_buffers=64MB]
    volumes: [external_collab_postgres:/var/lib/postgresql/data]
    networks: [default]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U external_collab -d external_collab"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  external_collab_postgres: {}
