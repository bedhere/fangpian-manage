packages:
  - '!apps/external-collab'
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
virtualStoreDir: F:/value-flow-virtual-store
packageImportMethod: hardlink
confirmModulesPurge: false
overrides:
  deepmerge-ts: 8.0.0
